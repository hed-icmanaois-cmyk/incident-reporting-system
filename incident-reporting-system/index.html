<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Incident Reporting System</title>
  <meta name="theme-color" content="#0F172A">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    (function () {
      const saved = localStorage.getItem("irs-theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = saved || (prefersDark ? "dark" : "light");
    })();
  </script>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div id="nav-backdrop" class="nav-backdrop" aria-hidden="true"></div>
  <nav id="nav" aria-label="Main navigation"></nav>

  <header class="topbar">
    <div class="topbar-left">
      <button id="menu-btn" class="icon-btn mobile-only" type="button" aria-label="Open navigation menu" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <h1 id="title">Incident Reporting System</h1>
    </div>
    <div class="topbar-right">
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle dark mode" title="Toggle light/dark mode"></button>
    </div>
  </header>

  <main>
    <p id="msg" class="msg" role="status" aria-live="polite"></p>
    <div id="app"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
