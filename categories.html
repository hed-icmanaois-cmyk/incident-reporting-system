<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories & Types | Incident Reporting System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header><h1>🚨 Categories & Types</h1></header>
  <main>
    <p id="msg" class="msg"></p>
    <form id="cform"><h3>Incident Category</h3><input type="hidden" id="c_id">
      <div class="grid"><label>Name *<input id="c_name"></label><label>Description<input id="c_desc"></label></div>
      <button>Save Category</button></form>
    <div class="table-wrap"><table><thead><tr><th>Category</th><th>Description</th><th>Status</th><th></th></tr></thead><tbody id="crows"></tbody></table></div>
    <form id="tform" style="margin-top:1.5rem"><h3>Incident Type</h3><input type="hidden" id="t_id">
      <div class="grid"><label>Name *<input id="t_name"></label><label>Category *<select id="t_cat"></select></label></div>
      <button>Save Type</button></form>
    <div class="table-wrap"><table><thead><tr><th>Type</th><th>Category</th><th>Status</th><th></th></tr></thead><tbody id="trows"></tbody></table></div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/common.js"></script>
  <script src="js/categories.js"></script>
</body>
</html>
