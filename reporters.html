<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reporter Management | Incident Reporting System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header><h1>🚨 Reporter Management</h1></header>
  <main>
    <form id="form">
      <h3 id="ftitle">Register Reporter</h3>
      <div class="grid">
        <label>Employee/Student ID *<input id="reporter_no"></label>
        <label>Full Name *<input id="full_name"></label>
        <label>Department *<select id="department_id"></select></label>
        <label>Position<input id="position"></label>
        <label>Contact Number<input id="contact"></label>
        <label>Email<input id="email" type="email"></label>
        <label>Address<input id="address"></label>
        <label>Reporter Type *<select id="reporter_type"><option>Employee</option><option>Student</option><option>Visitor</option><option>Contractor</option></select></label>
        <label>Status<select id="status"><option>Active</option><option>Inactive</option></select></label>
      </div>
      <button>Save Reporter</button> <button type="button" class="sec" onclick="resetForm()">Clear</button>
      <p id="msg" class="msg"></p>
    </form>
    <div class="card grid">
      <label>Search name<input id="qname" oninput="render()"></label>
      <label>Search ID<input id="qid" oninput="render()"></label>
      <label>Department<select id="fdept" onchange="render()"></select></label>
      <label>Type<select id="ftype" onchange="render()"><option value="">All types</option><option>Employee</option><option>Student</option><option>Visitor</option><option>Contractor</option></select></label>
    </div>
    <div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Department</th><th>Type</th><th>Contact</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/common.js"></script>
  <script src="js/reporters.js"></script>
</body>
</html>
